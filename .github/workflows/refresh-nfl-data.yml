name: Refresh NFL statistics

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data tools
        run: python -m pip install --upgrade pandas pyarrow requests scikit-learn numpy
      - name: Download and prepare NFL statistics
        run: python scripts/update_nfl_data.py
      - name: Build Next Gen Stats metrics and matchup predictions
        run: python scripts/update_advanced_nfl_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nfl-players.json public/data/nfl-status.json public/data/nfl-ngs-metrics.json public/data/nfl-matchup-predictions.json
          if git diff --cached --quiet; then
            echo "No NFL data changes to commit."
          else
            git commit -m "Refresh NFL statistics data"
            git pull --rebase origin main
            git push
          fi
