name: Refresh GRIDIRON CLIPS
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
jobs:
  refresh-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official NFL and college uploads
        run: |
          set -e
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            "https://gridiron-iq-orcin.vercel.app/api/clips" \
            -o /tmp/clips.json
          node -e "const d=require('/tmp/clips.json'); if(!Array.isArray(d.videos)) process.exit(1); console.log('Checked '+d.videos.length+' official clips at '+d.updatedAt); if(d.errors?.length) console.log(JSON.stringify(d.errors));"
